[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
# Not panic = "abort": a panic must still unwind, or Session::drop never runs
# and the box outlives the process.
